<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOCMAN AI Concierge</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --vocman-blue: #004a99;
            --vocman-dark: #002d5e;
            --glass-bg: rgba(255, 255, 255, 0.95);
            --bot-bubble: #ffffff;
            --user-bubble: #004a99;
            --shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; transition: all 0.3s ease; }

        /* Floating Trigger */
        #bot-launcher {
            position: fixed; bottom: 30px; right: 30px; width: 65px; height: 65px;
            background: var(--vocman-blue); border-radius: 50%; display: flex;
            align-items: center; justify-content: center; color: white;
            font-size: 28px; cursor: pointer; z-index: 9999;
            box-shadow: 0 8px 20px rgba(0,74,153,0.3);
        }
        #bot-launcher:hover { transform: scale(1.1) rotate(5deg); }

        /* Chat Window */
        #chat-window {
            position: fixed; bottom: 110px; right: 30px; width: 400px; height: 600px;
            max-height: 80vh; background: var(--glass-bg); backdrop-filter: blur(10px);
            border-radius: 20px; box-shadow: var(--shadow); display: none;
            flex-direction: column; overflow: hidden; z-index: 10000;
            border: 1px solid rgba(255,255,255,0.3); transform: translateY(20px); opacity: 0;
        }
        #chat-window.active { display: flex; transform: translateY(0); opacity: 1; }

        /* Header */
        .chat-header {
            background: var(--vocman-blue); padding: 18px 20px; color: white;
            display: flex; align-items: center; justify-content: space-between;
        }
        .header-info h4 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }
        .header-info span { font-size: 11px; opacity: 0.8; }

        /* Body */
        #chat-body {
            flex: 1; padding: 20px; overflow-y: auto; background: #f0f4f8;
            display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth;
        }

        .msg { max-width: 85%; padding: 12px 16px; border-radius: 15px; font-size: 14px; line-height: 1.5; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .bot-msg { background: var(--bot-bubble); color: #333; align-self: flex-start; border-bottom-left-radius: 2px; }
        .user-msg { background: var(--user-bubble); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        
        .timestamp { font-size: 10px; margin-top: 5px; opacity: 0.6; display: block; }
        .bot-msg .timestamp { text-align: left; }
        .user-msg .timestamp { text-align: right; color: #eee; }

        /* Speaker Icon in Bot Msg */
        .speaker-icon {
            display: inline-block; margin-left: 8px; cursor: pointer; color: var(--vocman-blue);
            vertical-align: middle; font-size: 13px;
        }

        /* Question Buttons */
        .options-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .option-btn {
            background: white; border: 1.5px solid var(--vocman-blue); color: var(--vocman-blue);
            padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; font-weight: 600;
        }
        .option-btn:hover { background: var(--vocman-blue); color: white; }

        /* Typing Indicator */
        #typing { font-size: 12px; color: #666; display: none; margin-bottom: 10px; }

        /* Footer Input */
        .chat-footer { padding: 15px; background: white; border-top: 1px solid #eee; display: flex; align-items: center; gap: 10px; }
        #user-input { flex: 1; border: 1px solid #eee; border-radius: 25px; padding: 10px 18px; outline: none; font-size: 14px; }
        #user-input:focus { border-color: var(--vocman-blue); }
        
        .footer-btns { display: flex; gap: 12px; font-size: 18px; color: var(--vocman-blue); }
        .footer-btns i { cursor: pointer; }
        .mic-active { color: #e74c3c !important; animation: pulse 1s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* Mobile Adjustments */
        @media (max-width: 450px) {
            #chat-window { width: 90%; right: 5%; bottom: 100px; height: 70vh; }
        }
    </style>
</head>
<body>

    <div id="bot-launcher" onclick="toggleChat()">
        <i class="fas fa-robot"></i>
    </div>

    <div id="chat-window">
        <div class="chat-header">
            <div class="header-info">
                <h4>VOCMAN AI Support</h4>
                <span><i class="fas fa-circle" style="color: #2ecc71; font-size: 8px;"></i> Always Online</span>
            </div>
            <div style="cursor: pointer;">
                <i class="fas fa-broom" onclick="clearChat()" style="margin-right:15px;" title="Clear Chat"></i>
                <i class="fas fa-minus" onclick="toggleChat()"></i>
            </div>
        </div>

        <div id="chat-body">
            <div id="typing">VOCMAN is thinking...</div>
        </div>

        <div class="chat-footer">
            <i class="fas fa-microphone" id="mic-btn" onclick="startVoiceRecognition()" title="Speak your question"></i>
            <input type="text" id="user-input" placeholder="Type a message..." onkeypress="checkEnter(event)">
            <div class="footer-btns">
                <i class="fas fa-paper-plane" onclick="sendMessage()"></i>
            </div>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const chatBody = document.getElementById('chat-body');
        const userInput = document.getElementById('user-input');
        const typing = document.getElementById('typing');
        const micBtn = document.getElementById('mic-btn');

        // QA Database
        const qaData = {
            "what is vocman": "VOCMAN Pvt. Ltd. is an IT solutions company.",
            "what services do you offer": "We offer web development, software development, AI, GIS, and cloud solutions.",
            "how can i contact vocman": "You can contact us through phone, email, or contact form in the Contact section.",
            "do you build websites": "Yes, we create responsive and modern websites.",
            "do you develop mobile apps": "Yes, we develop Android and iOS apps.",
            "do you provide ai solutions": "Yes, we provide AI and machine learning solutions.",
            "where is vocman located": "Our office details are available in the contact section at the bottom of this page.",
            "how do i get a quote": "Please fill the contact form or chat with us for a personalized quote.",
            "do you work with government projects": "Yes, we also handle enterprise and government projects.",
            "who created this website": "This website is developed  by ansh sharma."
        };

        const questionList = Object.keys(qaData);

        // State & Initialization
        let isChatOpen = false;

        function toggleChat() {
            isChatOpen = !isChatOpen;
            chatWindow.classList.toggle('active', isChatOpen);
            if (isChatOpen && chatBody.children.length === 1) {
                greet();
            }
        }

        function greet() {
            addMessage("bot", "Hello 👋 Welcome to VOCMAN Pvt. Ltd. How can I help you today?");
            showOptions();
        }

        function showOptions() {
            const container = document.createElement('div');
            container.className = 'options-container';
            questionList.forEach(q => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = q.charAt(0).toUpperCase() + q.slice(1) + "?";
                btn.onclick = () => {
                    userInput.value = q;
                    sendMessage();
                };
                container.appendChild(btn);
            });
            chatBody.insertBefore(container, typing);
            scrollChat();
        }

        function checkEnter(e) { if (e.key === 'Enter') sendMessage(); }

        function sendMessage() {
            const text = userInput.value.trim().toLowerCase();
            if (!text) return;

            addMessage("user", text);
            userInput.value = "";
            showTyping(true);

            setTimeout(() => {
                showTyping(false);
                let response = qaData[text];
                
                // Smart Keyword Matching
                if (!response) {
                    const match = questionList.find(q => text.includes(q) || q.includes(text));
                    response = match ? qaData[match] : "Sorry, please choose one of the available options or use common keywords.";
                }

                addMessage("bot", response);
            }, 800);
        }

        function addMessage(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${sender}-msg`;
            
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            let speakerHtml = sender === 'bot' ? `<i class="fas fa-volume-up speaker-icon" onclick="speakText('${text.replace(/'/g, "\\'")}')"></i>` : "";
            
            msgDiv.innerHTML = `${text} ${speakerHtml} <span class="timestamp">${time}</span>`;
            
            chatBody.insertBefore(msgDiv, typing);
            scrollChat();
        }

        function showTyping(status) {
            typing.style.display = status ? 'block' : 'none';
            scrollChat();
        }

        function scrollChat() { chatBody.scrollTop = chatBody.scrollHeight; }

        function clearChat() {
            chatBody.innerHTML = '<div id="typing">VOCMAN is thinking...</div>';
            greet();
        }

        // --- VOICE FEATURES ---

        // Text-to-Speech (Speaker)
        function speakText(text) {
            const synth = window.speechSynthesis;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1;
            utterance.pitch = 1;
            synth.speak(utterance);
        }

        // Speech-to-Text (Microphone)
        function startVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Voice recognition not supported in this browser.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            
            recognition.onstart = () => micBtn.classList.add('mic-active');
            recognition.onend = () => micBtn.classList.remove('mic-active');

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                userInput.value = transcript;
                sendMessage();
            };

            recognition.start();
        }
    </script>
</body>
</html>
